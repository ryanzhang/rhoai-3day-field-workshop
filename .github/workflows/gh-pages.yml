name: github pages

on:
  push:
    branches: [main, zh]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout English (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: en

      - name: Checkout Chinese (zh)
        uses: actions/checkout@v4
        with:
          ref: zh
          path: zh-src

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: en/package-lock.json

      - name: Build English site
        run: |
          cd en
          npm ci
          npm run build

      - name: Build Chinese site
        run: |
          cd zh-src
          npm ci
          npm run build
          mkdir -p ../en/www/zh
          cp -r www/* ../en/www/zh/

      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: en/www

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
